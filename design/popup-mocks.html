<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SubView popup — four directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Instrument+Sans:wght@400;600&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;900&family=Chakra+Petch:wght@500;700&family=VT323&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=M+PLUS+1+Code:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* ---------- page ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 28px 60px;
    background: #d9d6d1; color: #1b1b1b;
    font: 14px/1.5 "Instrument Sans", system-ui, sans-serif;
  }
  .page-head { max-width: 1480px; margin: 0 auto 26px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between; }
  .page-head h1 { margin: 0; font: 900 28px/1 "Fraunces", serif; letter-spacing: -0.02em; }
  .page-head p { margin: 6px 0 0; color: #555; max-width: 640px; }
  .switcher { display: flex; gap: 6px; padding: 4px; border-radius: 999px; background: #1b1b1b; }
  .switcher button { border: 0; padding: 8px 16px; border-radius: 999px; background: transparent; color: #bbb; font: 600 13px/1 "Instrument Sans", sans-serif; cursor: pointer; }
  .switcher button[aria-pressed="true"] { background: #fff; color: #111; }
  .grid { max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 28px; justify-items: center; }
  figure { margin: 0; display: grid; gap: 12px; justify-items: center; }
  figcaption { text-align: center; max-width: 340px; }
  figcaption b { display: block; font: 700 17px/1.2 "Fraunces", serif; }
  figcaption span { color: #555; font-size: 12.5px; }
  .mock { width: 340px; position: relative; overflow: hidden; border-radius: 14px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.12); }

  /* shared bits each theme restyles */
  .mock .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .mock button { font: inherit; cursor: pointer; }
  /* Only the current state's text shows; shown text keeps its theme layout. */
  .mock:not([data-state="off"]) [data-only="off"],
  .mock:not([data-state="finding"]) [data-only="finding"],
  .mock:not([data-state="live"]) [data-only="live"] { display: none !important; }

  /* =========================================================
     1. SUBTITLE PAPER — cinema programme, cream stock, one yellow subtitle bar
     ========================================================= */
  .paper { background: #f5efe3; color: #1d1a16; padding: 20px 22px 18px; font: 13px/1.45 "Instrument Sans", sans-serif;
    background-image: radial-gradient(#0000000a 1px, transparent 1px); background-size: 4px 4px; }
  .paper .top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.5px solid #1d1a16; padding-bottom: 10px; }
  .paper .brand { font: 900 22px/1 "Fraunces", serif; letter-spacing: -0.03em; font-style: italic; }
  .paper .site { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .paper .hero { display: grid; justify-items: center; padding: 22px 0 14px; }
  .paper .stamp { width: 150px; height: 150px; border-radius: 50%; border: 2px solid #1d1a16; background: transparent; display: grid; place-items: center; position: relative; transition: background .3s, color .3s, transform .15s; }
  .paper .stamp::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; border: 1px dashed #1d1a1666; }
  .paper .stamp:active { transform: scale(.97); }
  .paper .stamp b { font: 900 34px/1 "Fraunces", serif; font-style: italic; }
  .paper .stamp small { display: block; margin-top: 4px; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; }
  .paper[data-state="live"] .stamp { background: #1d1a16; color: #f5efe3; }
  .paper[data-state="finding"] .stamp::before { border-style: solid; border-color: #1d1a16 transparent transparent transparent; border-width: 2px; animation: spin 1.1s linear infinite; inset: -6px; }
  .paper .sub-bar { margin-top: 16px; padding: 6px 12px; background: #1d1a16; color: #ffd84a; font: 600 13px/1.3 "Instrument Sans", sans-serif; text-align: center; max-width: 280px; }
  .paper .meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; padding: 12px 0; border-top: 1px solid #1d1a1633; border-bottom: 1px solid #1d1a1633; margin-bottom: 12px; }
  .paper .meta dt { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: #6b6156; }
  .paper .meta dd { margin: 0; font: 700 15px/1.2 "Fraunces", serif; text-align: right; }
  .paper .ctl { display: grid; gap: 12px; }
  .paper .slider { width: 100%; accent-color: #1d1a16; }
  .paper .toggle { width: 34px; height: 18px; border: 1.5px solid #1d1a16; border-radius: 99px; background: transparent; position: relative; padding: 0; }
  .paper .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: #1d1a16; transition: left .2s; }
  .paper .toggle.on { background: #ffd84a; } .paper .toggle.on::after { left: 17px; }
  .paper .nudge { display: flex; border: 1.5px solid #1d1a16; } .paper .nudge button { width: 32px; border: 0; background: transparent; font-size: 16px; }
  .paper .nudge span { flex: 1; text-align: center; padding: 6px 0; border-inline: 1.5px solid #1d1a16; font: 700 14px/1.2 "Fraunces", serif; }
  .paper .foot { margin-top: 14px; font-size: 11px; color: #6b6156; text-align: right; font-style: italic; font-family: "Fraunces", serif; }

  /* =========================================================
     2. MANGA POP — ink outlines, halftone, a sound-effect burst
     ========================================================= */
  .manga { background: #fffdf4; color: #111; padding: 16px 18px 16px; font: 500 13px/1.4 "Zen Kaku Gothic New", sans-serif;
    border: 3px solid #111; }
  .manga::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(#111 1.2px, transparent 1.4px); background-size: 9px 9px; opacity: .08; }
  .manga .top { display: flex; justify-content: space-between; align-items: center; }
  .manga .brand { font: 400 20px/1 "Dela Gothic One", sans-serif; transform: skew(-6deg); }
  .manga .brand i { color: #ff3b6b; font-style: normal; }
  .manga .site { border: 2px solid #111; padding: 2px 8px; font: 900 11px/1.4 "Zen Kaku Gothic New", sans-serif; background: #fff; box-shadow: 2px 2px 0 #111; }
  .manga .hero { display: grid; justify-items: center; padding: 18px 0 8px; position: relative; }
  .manga .burst { width: 170px; height: 170px; border: 0; padding: 0; background: transparent; position: relative; display: grid; place-items: center; transition: transform .15s; }
  .manga .burst svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .manga .burst svg polygon { fill: #fff; stroke: #111; stroke-width: 4; stroke-linejoin: round; transition: fill .2s; }
  .manga .burst span { position: relative; font: 400 26px/1 "Dela Gothic One", sans-serif; transform: rotate(-8deg); }
  .manga .burst small { position: relative; display: block; font: 900 10px/1 "Zen Kaku Gothic New"; letter-spacing: .2em; margin-top: 4px; transform: rotate(-8deg); }
  .manga .burst:active { transform: scale(.95) rotate(-2deg); }
  .manga[data-state="live"] .burst svg polygon { fill: #ffe14d; }
  .manga[data-state="live"] .burst span { color: #ff3b6b; -webkit-text-stroke: 1.5px #111; }
  .manga[data-state="finding"] .burst svg { animation: wobble .35s ease-in-out infinite alternate; }
  .manga[data-state="finding"] .burst svg polygon { fill: #8ee8ff; }
  .manga .bubble { position: relative; margin: 6px auto 14px; max-width: 270px; padding: 9px 12px; background: #fff; border: 2.5px solid #111; border-radius: 18px; text-align: center; font-weight: 500; }
  .manga .bubble::after { content: ""; position: absolute; top: -12px; left: 50%; width: 16px; height: 16px; background: #fff; border-left: 2.5px solid #111; border-top: 2.5px solid #111; transform: translateX(-50%) rotate(45deg); }
  .manga .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .manga .panel { border: 2.5px solid #111; background: #fff; padding: 6px 9px; box-shadow: 3px 3px 0 #111; }
  .manga .panel small { display: block; font: 900 9.5px/1 "Zen Kaku Gothic New"; letter-spacing: .14em; color: #ff3b6b; }
  .manga .panel b { font: 400 15px/1.3 "Dela Gothic One", sans-serif; }
  .manga .ctl { display: grid; gap: 10px; border: 2.5px solid #111; background: #fff; padding: 10px 12px; box-shadow: 3px 3px 0 #111; position: relative; }
  .manga .slider { width: 100%; accent-color: #ff3b6b; }
  .manga .toggle { width: 40px; height: 22px; border: 2.5px solid #111; border-radius: 99px; background: #fff; position: relative; padding: 0; }
  .manga .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #111; transition: left .2s; }
  .manga .toggle.on { background: #ffe14d; } .manga .toggle.on::after { left: 20px; background: #ff3b6b; box-shadow: 0 0 0 2px #111; }
  .manga .nudge { display: flex; gap: 6px; } .manga .nudge button { width: 30px; border: 2.5px solid #111; background: #8ee8ff; font-weight: 900; box-shadow: 2px 2px 0 #111; }
  .manga .nudge span { flex: 1; text-align: center; border: 2.5px solid #111; font: 400 15px/1.6 "Dela Gothic One"; }
  .manga .foot { margin-top: 10px; text-align: right; font-weight: 900; font-size: 11px; }

  /* =========================================================
     3. POCKET WALKMAN — brushed metal, green LCD, VU needle
     ========================================================= */
  .walkman { padding: 16px 16px 14px; color: #222; font: 500 12px/1.4 "Chakra Petch", sans-serif;
    background: linear-gradient(135deg, #c9ccd0, #eef0f2 30%, #b8bcc1 60%, #e3e5e8);
    background-blend-mode: normal; }
  .walkman::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35;
    background: repeating-linear-gradient(90deg, #fff0 0 1px, #ffffff40 1px 2px, #0000 2px 3px); }
  .walkman .top { display: flex; justify-content: space-between; align-items: center; position: relative; }
  .walkman .brand { font: 700 15px/1 "Chakra Petch"; letter-spacing: .3em; text-transform: uppercase; }
  .walkman .brand span { color: #d2381e; }
  .walkman .badge { font: 700 9px/1 "Chakra Petch"; letter-spacing: .2em; border: 1px solid #333; padding: 3px 6px; border-radius: 3px; }
  .walkman .lcd { position: relative; margin: 12px 0; padding: 10px 12px; border-radius: 6px; background: #9fb08a; color: #1d2614; font: 22px/1 "VT323", monospace;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.45), 0 1px 0 #fff8; }
  .walkman .lcd::after { content: ""; position: absolute; inset: 0; border-radius: 6px; background: repeating-linear-gradient(0deg, #0000 0 2px, #00000010 2px 3px); }
  .walkman .lcd .l1 { display: flex; justify-content: space-between; font-size: 15px; opacity: .8; }
  .walkman .lcd .l2 { font-size: 30px; letter-spacing: .04em; }
  .walkman .lcd .l3 { font-size: 15px; }
  .walkman[data-state="finding"] .lcd .l2 { animation: blink 1s steps(2) infinite; }
  .walkman .deck { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; position: relative; }
  .walkman .vu { position: relative; height: 92px; border-radius: 6px; background: linear-gradient(#fbf6e6, #efe6c8); box-shadow: inset 0 1px 4px rgba(0,0,0,.4); overflow: hidden; }
  .walkman .vu svg { width: 100%; height: 100%; }
  .walkman .needle { transform-origin: 90px 92px; transition: transform .6s cubic-bezier(.3,1.6,.5,1); }
  .walkman[data-state="off"] .needle { transform: rotate(-52deg); }
  .walkman[data-state="finding"] .needle { animation: needle 1.2s ease-in-out infinite alternate; }
  .walkman[data-state="live"] .needle { transform: rotate(14deg); animation: jitter .18s ease-in-out infinite alternate; }
  .walkman .play { width: 92px; height: 92px; border-radius: 50%; border: 0; padding: 0; position: relative;
    background: radial-gradient(circle at 35% 30%, #fafafa, #b9bdc2 60%, #8b9096); box-shadow: 0 6px 12px rgba(0,0,0,.35), inset 0 -3px 6px rgba(0,0,0,.25), inset 0 2px 2px #fff; }
  .walkman .play::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; border: 1px solid #0003; }
  .walkman .play i { position: absolute; top: 9px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #5a1a10; box-shadow: inset 0 1px 2px #000; }
  .walkman[data-state="live"] .play i { background: #ff4a2a; box-shadow: 0 0 10px #ff4a2a; }
  .walkman[data-state="finding"] .play i { background: #ffb02a; animation: blink .6s steps(2) infinite; }
  .walkman .play b { position: relative; font: 700 12px/1 "Chakra Petch"; letter-spacing: .2em; }
  .walkman .play:active { box-shadow: 0 2px 4px rgba(0,0,0,.35), inset 0 3px 6px rgba(0,0,0,.35); }
  .walkman .ctl { display: grid; gap: 10px; margin-top: 12px; position: relative; padding: 10px; border-radius: 6px; background: #0000000d; box-shadow: inset 0 1px 2px #0003; }
  .walkman .slider { width: 100%; accent-color: #d2381e; }
  .walkman .toggle { width: 38px; height: 20px; padding: 0; border-radius: 4px; border: 1px solid #555; background: linear-gradient(#ddd, #aaa); position: relative; }
  .walkman .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; border-radius: 3px; background: linear-gradient(#444, #111); transition: left .15s; }
  .walkman .toggle.on::after { left: 18px; background: linear-gradient(#ff6a4a, #c22a10); }
  .walkman .nudge { display: flex; gap: 4px; } .walkman .nudge button { width: 30px; border: 1px solid #555; border-radius: 4px; background: linear-gradient(#eee, #aaa); font-weight: 700; }
  .walkman .nudge span { flex: 1; text-align: center; background: #9fb08a; border-radius: 4px; font: 20px/1.3 "VT323"; box-shadow: inset 0 1px 3px #0006; }
  .walkman .foot { margin-top: 10px; text-align: right; letter-spacing: .14em; text-transform: uppercase; font-size: 10px; position: relative; }

  /* =========================================================
     4. TOKYO NIGHT — neon signage, 吹替 kanji
     ========================================================= */
  .tokyo { padding: 18px 20px 16px; color: #e6e8ff; font: 400 12.5px/1.5 "M PLUS 1 Code", monospace;
    background: radial-gradient(90% 60% at 80% 0%, #3b1450 0%, transparent 60%), radial-gradient(80% 60% at 0% 100%, #0e2c4a 0%, transparent 60%), #0a0b17; }
  .tokyo::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background: repeating-linear-gradient(0deg, #ffffff05 0 1px, transparent 1px 3px); }
  .tokyo .top { display: flex; justify-content: space-between; align-items: center; position: relative; }
  .tokyo .brand { font: 800 18px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -0.02em; }
  .tokyo .brand span { color: #ff4fd8; text-shadow: 0 0 10px #ff4fd8; }
  .tokyo .site { color: #7cf3ff; font-size: 11px; }
  .tokyo .hero { position: relative; display: grid; justify-items: center; padding: 18px 0 8px; }
  .tokyo .kanji { position: absolute; top: 4px; right: -6px; writing-mode: vertical-rl; font: 700 44px/1 "M PLUS 1 Code"; color: transparent; -webkit-text-stroke: 1px #ff4fd855; letter-spacing: .1em; }
  .tokyo[data-state="live"] .kanji { color: #ff4fd8; -webkit-text-stroke: 0; text-shadow: 0 0 12px #ff4fd8, 0 0 30px #ff4fd8aa; }
  .tokyo .orb { width: 156px; height: 156px; border-radius: 50%; border: 2px solid #7cf3ff55; background: radial-gradient(circle at 50% 40%, #16183a, #090a18); position: relative; display: grid; place-items: center; color: #7cf3ff; transition: box-shadow .4s, border-color .4s; }
  .tokyo .orb::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 1px solid #7cf3ff33; }
  .tokyo .orb b { font: 800 22px/1 "Bricolage Grotesque", sans-serif; letter-spacing: .08em; }
  .tokyo .orb small { display: block; margin-top: 6px; font-size: 10px; letter-spacing: .3em; opacity: .7; }
  .tokyo[data-state="live"] .orb { border-color: #7cf3ff; box-shadow: 0 0 22px #7cf3ffaa, inset 0 0 26px #7cf3ff44; text-shadow: 0 0 8px #7cf3ff; }
  .tokyo[data-state="finding"] .orb::before { border: 2px solid transparent; border-top-color: #ff4fd8; border-right-color: #ff4fd8; animation: spin .9s linear infinite; box-shadow: 0 0 10px #ff4fd855; }
  .tokyo .line { margin: 12px auto 14px; max-width: 270px; text-align: center; color: #b8bce8; }
  .tokyo .chips { display: flex; gap: 8px; margin-bottom: 12px; }
  .tokyo .chip { flex: 1; padding: 8px 10px; border-radius: 10px; background: #ffffff08; border: 1px solid #ffffff14; }
  .tokyo .chip small { display: block; font-size: 9.5px; letter-spacing: .2em; color: #ff4fd8; }
  .tokyo .chip b { font: 700 13px/1.3 "M PLUS 1 Code"; color: #fff; }
  .tokyo .ctl { display: grid; gap: 11px; padding: 12px; border-radius: 12px; background: #ffffff06; border: 1px solid #ffffff12; }
  .tokyo .slider { width: 100%; accent-color: #7cf3ff; }
  .tokyo .toggle { width: 38px; height: 20px; border: 1px solid #ffffff30; border-radius: 99px; background: #ffffff10; position: relative; padding: 0; }
  .tokyo .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: #8a8fbf; transition: left .2s; }
  .tokyo .toggle.on { border-color: #ff4fd8; box-shadow: 0 0 10px #ff4fd855; } .tokyo .toggle.on::after { left: 21px; background: #ff4fd8; box-shadow: 0 0 8px #ff4fd8; }
  .tokyo .nudge { display: flex; border: 1px solid #ffffff25; border-radius: 9px; overflow: hidden; } .tokyo .nudge button { width: 32px; border: 0; background: #ffffff0d; color: #7cf3ff; font-size: 16px; }
  .tokyo .nudge span { flex: 1; text-align: center; padding: 6px 0; color: #fff; }
  .tokyo .foot { margin-top: 12px; text-align: right; color: #6d72a8; font-size: 10.5px; position: relative; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { to { visibility: hidden; } }
  @keyframes wobble { from { transform: rotate(-4deg) scale(.98); } to { transform: rotate(4deg) scale(1.02); } }
  @keyframes needle { from { transform: rotate(-40deg); } to { transform: rotate(20deg); } }
  @keyframes jitter { from { transform: rotate(10deg); } to { transform: rotate(18deg); } }
</style>
</head>
<body>
  <header class="page-head">
    <div>
      <h1>SubView popup — four directions</h1>
      <p>Same contents in each: on/off for the site, status, Dub server and source, Dub volume, mute original, Dub timing and auto offset. Switch states to see how each one moves.</p>
    </div>
    <div class="switcher" role="group" aria-label="State">
      <button data-set="off" aria-pressed="false">Off</button>
      <button data-set="finding" aria-pressed="false">Finding</button>
      <button data-set="live" aria-pressed="true">Live</button>
    </div>
  </header>

  <main class="grid">
    <!-- 1 -->
    <figure>
      <div class="mock paper" data-state="live">
        <div class="top"><span class="brand">SubView</span><span class="site">example.tv</span></div>
        <div class="hero">
          <button class="stamp">
            <span>
              <b data-only="off">Off</b><b data-only="finding">…</b><b data-only="live">Dub</b>
              <small data-only="off">Tap to dub</small><small data-only="finding">Finding</small><small data-only="live">Now playing</small>
            </span>
          </button>
          <p class="sub-bar">
            <span data-only="off">[ Sub plays as usual ]</span>
            <span data-only="finding">[ Loading Dub from the “alpha” server… ]</span>
            <span data-only="live">[ Playing the Dub in sync. Your tab stays on Sub. ]</span>
          </p>
        </div>
        <dl class="meta">
          <dt>Server</dt><dd><span data-only="off">—</span><span data-only="finding">searching</span><span data-only="live">alpha · embed</span></dd>
          <dt>Source</dt><dd><span data-only="off">—</span><span data-only="finding">hidden copy</span><span data-only="live">hidden copy</span></dd>
        </dl>
        <div class="ctl">
          <label>Dub volume <input class="slider" type="range" value="80" /></label>
          <div class="row"><span>Mute original audio</span><button class="toggle on" aria-label="toggle"></button></div>
          <div class="row"><span>Dub timing</span><div class="nudge" style="width:150px"><button>−</button><span>+1.5 s</span><button>+</button></div></div>
          <div class="row"><span>Auto offset</span><button class="toggle" aria-label="toggle"></button></div>
        </div>
        <p class="foot">Debug tools →</p>
      </div>
      <figcaption><b>1 · Subtitle Paper</b><span>Light, cinematic print. Fraunces serif, cream stock, the status as a yellow subtitle line. Calm and grown-up.</span></figcaption>
    </figure>

    <!-- 2 -->
    <figure>
      <div class="mock manga" data-state="live">
        <div class="top"><span class="brand">Sub<i>View!</i></span><span class="site">example.tv</span></div>
        <div class="hero">
          <button class="burst">
            <svg viewBox="0 0 200 200"><polygon points="100,8 118,52 162,26 146,72 194,78 152,104 186,142 138,138 140,188 106,154 82,194 72,148 26,170 48,128 6,108 52,90 22,46 72,58 78,12" /></svg>
            <span>
              <span data-only="off">OFF</span><span data-only="finding">...?!</span><span data-only="live">DUB!!</span>
              <small data-only="off">TAP TO DUB</small><small data-only="finding">SEARCHING</small><small data-only="live">ON AIR</small>
            </span>
          </button>
        </div>
        <p class="bubble">
          <span data-only="off">Sub plays as usual. Tap the burst to hear the Dub!</span>
          <span data-only="finding">Loading Dub from the “alpha” server…</span>
          <span data-only="live">Dub's playing in sync! Your tab stays on Sub.</span>
        </p>
        <div class="panels">
          <div class="panel"><small>SERVER</small><b><span data-only="off">—</span><span data-only="finding">???</span><span data-only="live">alpha</span></b></div>
          <div class="panel"><small>SOURCE</small><b><span data-only="off">—</span><span data-only="finding">hidden</span><span data-only="live">hidden</span></b></div>
        </div>
        <div class="ctl">
          <label>Dub volume <input class="slider" type="range" value="80" /></label>

  <script>
    const buttons = document.querySelectorAll(".switcher button");
    const set = state => {
      document.querySelectorAll(".mock").forEach(mock => mock.dataset.state = state);
      buttons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.set === state)));
    };
    buttons.forEach(button => button.addEventListener("click", () => set(button.dataset.set)));
    // Toggles and the big buttons are clickable for feel.
    document.querySelectorAll(".toggle").forEach(t => t.addEventListener("click", () => t.classList.toggle("on")));
    const order = ["off", "finding", "live"];
    document.querySelectorAll(".stamp, .burst, .play, .orb").forEach(b => b.addEventListener("click", event => {
      const mock = event.currentTarget.closest(".mock");
      mock.dataset.state = order[(order.indexOf(mock.dataset.state) + 1) % order.length];
    }));
  </script>
